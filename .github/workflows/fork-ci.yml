# The fork's own CI: the suites for what this fork adds, on GitHub's hosted runners.
#
# Which tests: every test file the fork has added or changed against upstream,
# worked out at run time from the merge base with marketcalls/openalgo, so a new
# test runs the day it lands and no list goes stale. Upstream's other tests are
# upstream's: its whole tree does not pass here (36 failures and 16 errors on
# dev on 2026-10-31, in broker plugins, rate limiters, a remote model catalogue
# and asset timestamps). A fixed list here once left three PRs' guards unrun.
#
# Upstream's ci.yml and security.yml are switched off on the fork in the repo's
# Actions settings rather than deleted, so upstream merges stay clean. Their
# whole-tree baseline is not green here, and one of their jobs commits built
# files to main.
#
# The deploy pipeline (algo-trading's deploy.yml) deploys a fork commit only
# when the "fork-ci" check below passed on it.

name: Fork CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    # The deployment's timezone (Dockerfile, docker-compose). Sandbox session
    # boundaries are IST wall times, and an upstream test of them builds its
    # rows from the host clock, so it fails on a UTC host.
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the history down to the merge base with upstream
      - name: Upstream, to tell the fork's tests from upstream's
        run: git fetch --no-tags https://github.com/marketcalls/openalgo.git main:refs/remotes/upstream/main
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Fork test suites
        # bash, not the default: GitHub then runs it with -eo pipefail, so a failed
        # git diff inside the pipeline below fails the step instead of handing on
        # an empty list that sort would report as success.
        shell: bash
        env:
          # The fork test files selected on 2026-10-31. Any shrink fails here: a
          # broken filter, or an upstream sync that drops a test the fork had
          # changed. Change it in the same commit that adds or removes fork tests,
          # where a reviewer sees it.
          MIN_FORK_TESTS: 33
        run: |
          base="$(git merge-base refs/remotes/upstream/main HEAD)"
          # Every test_*.py the fork added or changed, except test_gthread_*,
          # which the gthread job runs under gunicorn. --no-renames: an upstream
          # test the fork moved shows as an addition and stays selected.
          fork_tests="$(git diff --no-renames --name-only --diff-filter=AM "$base" HEAD -- test/ \
            | grep -E '(^|/)test_fyers[^/]*\.py$' | grep -v '^test/test_gthread_' | sort)"
          count="$(printf '%s' "$fork_tests" | grep -c . || true)"
          echo "$count fork test files selected:"
          echo "$fork_tests"
          if [ "$count" -lt "$MIN_FORK_TESTS" ]; then
            echo "::error::Only $count fork test files were selected, fewer than $MIN_FORK_TESTS. The selection is broken, or fork tests were removed without lowering MIN_FORK_TESTS."
            exit 1
          fi
          # Upstream files that test what the fork changed, kept by name.
          uv run pytest test/research test/sandbox $fork_tests \
            test/test_whatsapp_notify_contract.py test/test_whatsapp_owner_recipient.py \
            test/test_migrate_all.py \
            -q --timeout=120

  # Every test_gthread_*.py under a real gunicorn, upstream's gthread-migration
  # command (CLAUDE.md), with eventlet at the Dockerfile's pin: the strategy
  # host, the Sandbox and the brokers under both production workers.
  gthread:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Kolkata
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv pip install "gunicorn>=25.0,<26" "eventlet==0.41.2"
      - run: .venv/bin/python -m pytest test/test_gthread_*.py -o addopts="" --timeout=120 -rs

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - name: Fork test suites
        run: >-
          npx vitest run src/pages/runs src/components/portfolio src/pages/research
          src/pages/python-strategy src/pages/StrategyDashboard.test.tsx

  # The one check the deploy pipeline reads.
  fork-ci:
    needs: [backend, gthread, frontend]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Fork CI passed"
